<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance Corp - Online Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Global Finance Corp</h1>
        <p>Real-time Currency Converter</p>
    </header>
    <div class="container">
        <form id="converter-form">
            <div class="input-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" placeholder="Enter amount" step="0.01" required>
            </div>
            <div class="currency-selection">
                <div class="input-group">
                    <label for="from-currency">From:</label>
                    <select id="from-currency" required>
                        <!-- Options will be populated by JS -->
                    </select>
                </div>
                <button type="button" id="swap-btn" class="swap-btn">⇄</button>
                <div class="input-group">
                    <label for="to-currency">To:</label>
                    <select id="to-currency" required>
                        <!-- Options will be populated by JS -->
                    </select>
                </div>
            </div>
            <button type="submit" class="convert-btn">Convert</button>
        </form>
        <div id="rate-display" class="rate-display"></div>
        <div id="result" class="result"></div>
        <div class="additional-features">
            <button id="add-favorite" class="feature-btn">Add to Favorites</button>
            <div id="favorites" class="favorites">
                <h3>Favorite Conversions</h3>
                <ul id="favorites-list"></ul>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Global Finance Corp. All rights reserved.</p>
    </footer>
    <script type="module" src="main.js"></script>
</body>
</html>
